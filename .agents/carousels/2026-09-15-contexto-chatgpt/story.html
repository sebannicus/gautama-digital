<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gautama Digital — Historia</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap');
    :root {
      --W: 1080px;
      --H: 1920px;
      --S: 0.4;
      --cyan: #23E7FF;
      --cyan-soft: #89F5FF;
      --deep: #020817;
      --ink: #EAFBFF;
      --logo: url('../../../imagenes%20para%20historias/gautama_reel.png');
      /* Zonas seguras IG: ~250px arriba (avatar/nombre) y ~250px abajo (barra respuesta) */
      --safe-top: 300px;
      --safe-bottom: 320px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070d;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      font-family: Lato, Arial, sans-serif;
    }
    .story {
      width: calc(var(--W) * var(--S));
      height: calc(var(--H) * var(--S));
      overflow: hidden;
      position: relative;
      border-radius: 6px;
      box-shadow: 0 26px 90px rgba(0,0,0,.66);
    }
    .story-inner {
      width: var(--W);
      height: var(--H);
      transform: scale(var(--S));
      transform-origin: top left;
      position: absolute;
      inset: 0 auto auto 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 14%, rgba(35,231,255,.18), transparent 32%),
        radial-gradient(circle at 16% 82%, rgba(5,115,217,.3), transparent 36%),
        linear-gradient(160deg, #010613 0%, #03122B 52%, #061B3D 100%);
      padding: var(--safe-top) 90px var(--safe-bottom);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .story-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 97%, rgba(35,231,255,.07) 98% 100%) 0 0 / 100px 100px,
        linear-gradient(0deg, transparent 0 97%, rgba(35,231,255,.05) 98% 100%) 0 0 / 100px 100px;
      z-index: 1;
    }
    .story-inner > * { position: relative; z-index: 5; }

    .gautama {
      position: absolute;
      right: -60px;
      bottom: 180px;
      width: 560px;
      height: 520px;
      background: url('../../../_media/gautama-poses/pose-think.png') center bottom / contain no-repeat;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 44px rgba(35,231,255,.5));
      opacity: .38;
      z-index: 2;
    }

    .kicker {
      color: var(--cyan);
      font-size: 30px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .16em;
      margin-bottom: 40px;
    }
    .rule {
      width: 150px;
      height: 9px;
      background: var(--cyan);
      border-radius: 5px;
      margin-bottom: 52px;
      box-shadow: 0 0 34px rgba(35,231,255,.6);
    }
    h1 {
      color: #fff;
      font-size: 94px;
      line-height: 1.04;
      font-weight: 900;
      text-wrap: balance;
      margin-bottom: 56px;
    }
    .accent { color: var(--cyan); }

    .points { display: flex; flex-direction: column; gap: 28px; margin-bottom: 64px; }
    .point {
      display: flex;
      align-items: baseline;
      gap: 24px;
      color: var(--ink);
      font-size: 42px;
      line-height: 1.3;
      font-weight: 400;
    }
    .point .n {
      color: var(--cyan);
      font-size: 46px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .swipe {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 18px;
      min-height: 100px;
      padding: 0 46px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--cyan), #0C9CFF);
      color: #02101D;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 0 44px rgba(35,231,255,.42);
    }

    .brand-seal {
      position: absolute;
      left: 90px;
      bottom: 210px;
      z-index: 10;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--logo) center / cover no-repeat;
      border: 1px solid rgba(137,245,255,.34);
      box-shadow: 0 0 28px rgba(35,231,255,.26);
    }

    /* Guías de zona segura — solo visibles en preview, nunca en export */
    .safe-guide {
      position: absolute;
      left: 0; right: 0;
      background: rgba(255,80,80,.09);
      border-block: 1px dashed rgba(255,80,80,.35);
      z-index: 20;
      pointer-events: none;
    }
    .safe-guide.top { top: 0; height: var(--safe-top); }
    .safe-guide.bottom { bottom: 0; height: var(--safe-bottom); }
    body.export .safe-guide { display: none; }
  </style>
</head>
<body>
  <div class="story">
    <div class="story-inner">
      <div class="gautama"></div>

      <p class="kicker">Nuevo en el perfil</p>
      <div class="rule"></div>

      <h1>Si ChatGPT te responde <span class="accent">genérico</span>, el problema no es ChatGPT.</h1>

      <div class="points">
        <div class="point"><span class="n">1</span><span>Dile quién eres</span></div>
        <div class="point"><span class="n">2</span><span>Dile para quién es</span></div>
        <div class="point"><span class="n">3</span><span>Muéstrale un ejemplo tuyo</span></div>
      </div>

      <span class="swipe">Ver publicación &#8594;</span>

      <span class="brand-seal"></span>
      <div class="safe-guide top"></div>
      <div class="safe-guide bottom"></div>
    </div>
  </div>
</body>
</html>
